# Headers every proxied route needs. Included rather than repeated, so a change
# applies everywhere instead of to whichever location someone remembered.

# Preserve what the CLIENT asked for. Without these the backend sees nginx's own
# view of the request — Host would become the upstream name, and every client
# would appear to come from the gateway's IP, making per-user rate limiting and
# access logs useless.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# HTTP/1.1 to the upstream enables keep-alive, so nginx reuses connections
# instead of opening a new TCP connection per request. Under load that
# difference is large.
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

# Do not silently retry a failed request on another upstream. Retrying a POST
# that may already have been processed is how one booking becomes two — the
# idempotency key exists precisely so that retrying is a CLIENT decision made
# deliberately, not something the proxy does invisibly.
proxy_next_upstream off;