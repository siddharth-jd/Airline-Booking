# =============================================================================
# Nginx as the API gateway.
#
# WHY A GATEWAY AT ALL. Without one, a client must know that auth lives on 4001,
# flights on 4002 and bookings on 4003 — so the internal service topology leaks
# into every caller, and splitting or merging a service becomes a breaking change
# for them. With a gateway there is ONE address, and routing is a server-side
# concern that can change freely.
#
# It is also the natural single place for concerns that would otherwise be
# reimplemented in all four services: TLS termination, rate limiting, request
# logging, CORS, and blocking anything that should never be public.
#
# In the containerised stack this is the ONLY thing published to the host. The
# services have no host port mapping at all — they are reachable solely on the
# internal Docker network, by name. That is the property that makes this a
# gateway rather than a convenience.
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS server. Service names like `auth` resolve through it.
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format upstream_log '$remote_addr "$request" $status '
                            'upstream=$upstream_addr '
                            'request_time=$request_time upstream_time=$upstream_response_time';
    access_log /var/log/nginx/access.log upstream_log;

    # An upstream block per service. With one container each this is a trivial
    # pool, but it is the seam where horizontal scaling happens: adding replicas
    # means adding servers here, and nginx load-balances across them without any
    # client knowing.
    #
    # `keepalive` IS NOT OPTIONAL HERE, and leaving it out is a real bug that a
    # load test found: 11% of 31,802 requests returned 502 while the upstream
    # service logged no errors at all and never restarted.
    #
    # proxy_common.conf sets `proxy_http_version 1.1` and clears the Connection
    # header, which tells the backend "keep this connection open for reuse".
    # Without a `keepalive` directive nginx maintains no connection cache, so it
    # opens a fresh connection per request and abandons it — while the backend
    # is still holding it open expecting reuse. Under load the resulting
    # close/reuse races surface as intermittent 502s.
    #
    # The two settings must agree: either both keep-alive, or neither.
    #
    # `keepalive` is the number of IDLE connections kept per worker, not a
    # limit on concurrency.
    upstream auth_service {
        server auth:4001;
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }
    upstream flights_service {
        server flights:4002;
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }
    upstream bookings_service {
        server bookings:4003;
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    # RATE LIMITING is deliberately NOT enabled.
    #
    # A gateway is exactly the right place for it, and a production deployment
    # would have it. It is left off here because the k6 load tests and the
    # concurrency proof both drive high request rates through this proxy, and a
    # limiter would either corrupt those numbers or have to be tuned high enough
    # to never trigger — which is theatre, not protection. Claiming a rate limit
    # that is set to never fire would be worse than not having one.
    #
    # The zone below is the shape it would take:
    # limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

    server {
        listen 80;
        server_name _;

        # Do not advertise the exact nginx version in response headers.
        server_tokens off;

        client_max_body_size 1m;

        # The gateway's own health, distinct from any service's. Answers even if
        # every backend is down, which is what makes it useful for telling
        # "gateway is broken" apart from "a service is broken".
        location = /health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","component":"gateway"}';
        }

        location /auth/ {
            proxy_pass http://auth_service;
            include /etc/nginx/proxy_common.conf;
        }

        # API COMPOSITION: this one path under /flights is served by the
        # BOOKINGS service, because seat inventory is owned there
        # (DECISIONS.md 001). To a client the API reads as one coherent
        # surface; the split between services stays an internal detail.
        #
        # nginx evaluates regex locations before prefix locations, so this wins
        # over `location /flights` below regardless of the order they appear in.
        location ~ ^/flights/[0-9]+/seats$ {
            proxy_pass http://bookings_service;
            include /etc/nginx/proxy_common.conf;
        }

        location /flights {
            proxy_pass http://flights_service;
            include /etc/nginx/proxy_common.conf;
        }

        location /airports {
            proxy_pass http://flights_service;
            include /etc/nginx/proxy_common.conf;
        }

        location /bookings {
            proxy_pass http://bookings_service;
            include /etc/nginx/proxy_common.conf;
        }

        # The deliberately racy demo endpoint must never be reachable through the
        # public entry point, regardless of how the booking service is
        # configured. Defence in depth: the service already gates it behind
        # ENABLE_UNSAFE_DEMO, and the gateway refuses to route to it at all.
        location /demo/ {
            return 404;
        }

        # The web client, served as static files by the same nginx that proxies
        # the API. Same origin as /auth, /flights and /bookings, so the browser
        # makes no cross-origin requests and no CORS headers are needed anywhere
        # in the backend — one of the quieter benefits of a gateway.
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}